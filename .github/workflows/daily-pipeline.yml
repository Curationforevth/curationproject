# 일일 파이프라인 — 단계별 job.
#
# ⚠️ 직렬화(2026-06-29): 예전엔 4잡을 전부 병렬 실행했는데, 무료 Supabase 가
# 동시 부하로 statement timeout(57014)을 뿜어 모든 잡이 느려지고 enrich 의 reason
# 추출이 에러로 죽고 discovery/refresh-loan-count 가 타임아웃났다(마지막 풀 success
# 06-25). 근본원인 = 동시 DB 과부하. → `needs` + `if: always()` 로 직렬화해 한 번에
# 한 잡만 DB 를 쓰게 한다. 핵심가치(추천 엔진)에 직결된 **enrich 를 맨 앞**에 둬
# 깨끗한 DB 용량을 먼저 주고, 인기신호 작업(discovery/refresh-loan-count)은 뒤로.
# (Actions 무료라 wall-clock 손해는 비용이 아니다.)
#
# 실행 순서: enrich → collect → discovery → refresh-loan-count → (수동)build-and-recompute
# enrich 는 needs 없이 맨 먼저(이미 DB 의 rich_description 책 처리, 대기 불필요).
# if: always() 라 앞 잡이 실패해도 뒤 잡은 이어짐(직렬화만, 성공 게이팅 아님).
# YES24 스크래핑은 별도 workflow (daily-scrape.yml).

name: Daily Pipeline

on:
  # 무료 구조 (2026-06-25): 레포 공개로 GitHub Actions 무제한 무료. 스케줄은
  # 축적(discovery/collect/enrich)만 자동으로 돌린다 — egress·OpenAI 무거운
  # build-and-recompute 는 아래 if 로 수동(workflow_dispatch) 전용. 인덱스 빌드·배포는
  # 항상 사람이 수동 트리거(미검증 인덱스 자동배포 방지 + 무료 유지).
  # ⚠️ 시간대 가설은 틀렸다(2026-08-26 정정). 저녁으로 옮긴 뒤에도 8/1~8/25
  # **25/25 전부 cancelled**(discovery 25분·refresh 15분 job timeout). 8/25 실행에서
  # 타임아웃 난 그 ISBN 들을 한국 IP 에서 즉시 재호출하면 6/6 성공(평균 1.82s) —
  # 근본원인은 시간대가 아니라 **Actions 러너(해외 IP)→data4library.kr 경로**다.
  # 해법은 스케줄 이동이 아니라 "느린 경로에서도 수집은 계속된다":
  #   ① 정보나루 실패해도 책은 저장(loan_count=NULL → refresh 크론이 채움)
  #   ② 연속 실패 시 회로 개방 → 남은 호출 건너뜀
  #   ③ 시간 예산 소진 시 스스로 flush 후 종료(강제종료 = 전량 유실 방지)
  # 저녁 유지 자체는 무해하므로 크론은 그대로 둔다.
  schedule:
    - cron: '0 11 * * *'  # 20:00 KST 목표(실제 21~22시대) — 축적 jobs 만 자동
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 규모 (small=소량 검증 / full=평소 prod 규모)'
        type: choice
        options: [full, small]
        default: full

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # mode=small (workflow_dispatch) 일 때만 소량. schedule 및 full 은 아래 'else' 값
  # = 기존 prod 규모 그대로(동작 불변). small 은 실제 Actions 환경 end-to-end 검증용.
  GENRE_LIMIT: ${{ github.event.inputs.mode == 'small' && '5' || '300' }}
  COLLECT_TARGET: ${{ github.event.inputs.mode == 'small' && '3' || '200' }}
  ENRICH_LIMIT: ${{ github.event.inputs.mode == 'small' && '5' || '500' }}
  TIER1_LIMIT: ${{ github.event.inputs.mode == 'small' && '3' || '0' }}
  V3_LIMIT: ${{ github.event.inputs.mode == 'small' && '3' || '99999' }}
  REASON_LIMIT: ${{ github.event.inputs.mode == 'small' && '3' || '200' }}
  TIER2_LIMIT: ${{ github.event.inputs.mode == 'small' && '3' || '0' }}
  LOAN_LIMIT: ${{ github.event.inputs.mode == 'small' && '5' || '200' }}
  REEMBED_LIMIT: ${{ github.event.inputs.mode == 'small' && '3' || '300' }}
  # 시간 예산 — 각 job 의 timeout-minutes 보다 짧게 잡아 **강제종료 대신 스스로
  # flush 후 종료**하게 한다. 강제종료는 그때까지 처리분을 통째로 버린다.
  #   discovery: job 25분 → 15분(뒤에 backfill_genre 스텝이 남아있음)
  #   refresh  : job 15분 → 12분
  DISCOVERY_BUDGET_SECONDS: '900'
  REFRESH_BUDGET_SECONDS: '720'

jobs:
  # ── 수집: 정보나루 (enrich·collect 뒤) ──────
  discovery:
    needs: [collect]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25  # 하드 상한(안전망). 실제 종료는 DISCOVERY_BUDGET_SECONDS 가 먼저
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Discovery (Tier 1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA4LIBRARY_API_KEY: ${{ secrets.DATA4LIBRARY_API_KEY }}
        run: python3 -u scripts/data4library_discovery_collector.py --tier 1 --budget-seconds $DISCOVERY_BUDGET_SECONDS
      - name: Backfill genre (알라딘 → genre NULL 책)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
        run: python3 scripts/backfill_genre.py --limit $GENRE_LIMIT

  # ── 수집: 알라딘 + 보강 + Tier 1 임베딩 (enrich 뒤) ────
  collect:
    needs: [enrich]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Aladin batch collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
        run: python scripts/smart_batch_collector.py --phase item_list --daily-target $COLLECT_TARGET
      - name: Batch enricher (color + font)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/batch_enricher.py --limit $ENRICH_LIMIT
      - name: Tier 1 embedder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/tier1_embedder.py --limit $TIER1_LIMIT

  # ── 보강: 기존 책 v3 + reason + tier2 (수집과 병렬) ──
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: v3 vectors
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/generate_book_v3_vectors.py $V3_LIMIT
      - name: Reembed provisional (tier 라벨 교정 + rich 승격)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/reembed_provisional.py --limit $REEMBED_LIMIT
      - name: Reason extraction (v3)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/v3_reason_extract.py --limit $REASON_LIMIT
      - name: Tier 2 embedder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/tier2_embedder.py --limit $TIER2_LIMIT
      - name: Backfill feedback embeddings (요청경로 비차단 → 실패분 채움)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/backfill_feedback_embedding.py

  # ── 대출 수 갱신: 기존 책 loan_count 순환 갱신 (맨 뒤) ──────
  refresh-loan-count:
    needs: [discovery]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 하드 상한(안전망). 실제 종료는 REFRESH_BUDGET_SECONDS 가 먼저
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Refresh loan_count (oldest 200)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA4LIBRARY_API_KEY: ${{ secrets.DATA4LIBRARY_API_KEY }}
        run: python3 -u scripts/refresh_loan_count.py --limit $LOAN_LIMIT --budget-seconds $REFRESH_BUDGET_SECONDS

  # ── 마무리: 인덱스 빌드 + 취향 재계산 (수동 전용) ──
  build-and-recompute:
    # 수동(workflow_dispatch) 전용. build_index 는 전체 v3 벡터 read(Supabase egress
    # ~70MB) + reason 전량 build-임베딩(OpenAI). 스케줄로 매일 돌면 무료가 아니다
    # (egress ~2GB/월 + OpenAI ~$5/월). 인덱스 빌드·배포는 사람이 수동 트리거한다.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'small'
    needs: [discovery, collect, enrich]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Build recommendation index
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd recommendation-server
          python3 scripts/build_index.py --incremental
      - name: Commit index.pkl (DISARMED — 자동 배포 금지)
        run: |
          echo "⚠️ index.pkl 자동 커밋/배포 무장해제됨 (2026-06-25)."
          echo "토대 복구(reason 안전 + 커버리지) 검증 후 build-index.yml 수동 dispatch +"
          echo "artifact 검증(reason>0, books_loaded)으로만 배포한다. defense-in-depth."
          # git config user.name "github-actions[bot]"
          # git config user.email "github-actions[bot]@users.noreply.github.com"
          # git add recommendation-server/data/index.pkl
          # git diff --cached --quiet || git commit -m "chore: rebuild index.pkl ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # git push
      - name: Taste vector recomputation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/taste_recomputer.py --limit 500
